name: CI
on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}

run-name: "CI ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  test-debian-like:
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:latest
          - ubuntu:24.04
          - ubuntu:20.04
          - debian:testing
          - debian:stable
          - debian:oldstable
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
        shell: sh
        run: |
          command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates bash
          elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates bash
          elif command -v dnf >/dev/null 2>&1; then dnf install -y curl ca-certificates bash
          elif command -v yum >/dev/null 2>&1; then yum install -y curl ca-certificates bash
          elif command -v zypper >/dev/null 2>&1; then zypper -n install curl ca-certificates bash
          fi

      - name: install dependencies
        run: |
          apt-get update &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              automake \
              ca-certificates \
              git \
              curl \
              libhttp-daemon-perl \
              libhttp-daemon-ssl-perl \
              libplack-perl \
              libtest-mockmodule-perl \
              libtest-tcp-perl \
              libtest-warnings-perl \
              liburi-perl \
              libwww-perl \
              net-tools \
              make \
              ;
      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: autogen
        run: ./autogen
      - name: configure
        run: ./configure
      - name: check
        run: make VERBOSE=1 AM_COLOR_TESTS=always check
      - name: distcheck
        run: make VERBOSE=1 AM_COLOR_TESTS=always distcheck
      - name: distribution tarball is complete
        run: ./.github/workflows/scripts/dist-tarball-check
      - if: ${{ matrix.image == 'debian:testing' }}
        uses: actions/upload-artifact@v7
        with:
          name: distribution-tarball
          path: ddclient-*.tar.gz

  test-fedora-like:
    strategy:
      fail-fast: false
      matrix:
        image:
          - fedora:43
          - fedora:latest
          - fedora:rawhide
          - almalinux:8
          - almalinux:latest
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
        shell: sh
        run: |
          command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates bash
          elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates bash
          elif command -v dnf >/dev/null 2>&1; then dnf install -y curl ca-certificates bash
          elif command -v yum >/dev/null 2>&1; then yum install -y curl ca-certificates bash
          elif command -v zypper >/dev/null 2>&1; then zypper -n install curl ca-certificates bash
          fi

      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: enable repositories (AlmaLinux 8)
        if: ${{ matrix.image == 'almalinux:8' }}
        run: |
          dnf --refresh install -y 'dnf-command(config-manager)' epel-release &&
          dnf config-manager --set-enabled powertools
      - name: enable repositories (AlmaLinux latest)
        if: ${{ matrix.image == 'almalinux:latest' }}
        run: |
          dnf --refresh install -y 'dnf-command(config-manager)' epel-release &&
          dnf config-manager --set-enabled crb
      - name: install dependencies
        # The --skip-broken argument works around missing packages.  (They're
        # only used for testing, so it's OK to not install them.)
        run: |
          dnf --refresh install --skip-broken -y \
              automake \
              findutils \
              iproute \
              make \
              curl \
              perl \
              perl-HTTP-Daemon \
              perl-HTTP-Daemon-SSL \
              perl-IO-Socket-INET6 \
              perl-Plack \
              perl-Test-MockModule \
              perl-Test-TCP \
              perl-Test-Warnings \
              perl-core \
              perl-libwww-perl \
              net-tools \
              ;
      - name: autogen
        run: ./autogen
      - name: configure
        run: ./configure
      - name: check
        run: make VERBOSE=1 AM_COLOR_TESTS=always check
      - name: distcheck
        run: make VERBOSE=1 AM_COLOR_TESTS=always distcheck
